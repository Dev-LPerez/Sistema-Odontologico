schema: spec-driven

context: |
  Frontend PWA (iPad-first) del sistema de gestión odontológica para la Dra. Angelee Pacheco.
  Este directorio es Frontend dentro de un monorepo pnpm y consume el contrato Backend/openapi.json.
  Stack: TypeScript estricto, React + Vite, TanStack Router, TanStack Query con persistencia local,
  Zustand (solo estado mínimo de UI), React Hook Form + Zod, Tailwind CSS + shadcn/ui (Radix), FullCalendar,
  odontograma propio en SVG con Pointer Events a 60 FPS, signature_pad, react-zoom-pan-pinch, Recharts,
  vite-plugin-pwa (Workbox), Dexie (IndexedDB), Vitest, Testing Library, axe, MSW y Playwright.
  Arquitectura: Clean Architecture de 4 capas por feature (domain, application, infrastructure, presentation)
  en features/ (auth, patients, attention, odontogram, appointments, files, quotes, payments, reports, settings).
  Domain y application son TypeScript puro y no importan React, TanStack Query, fetch ni Dexie
  (verificado con eslint-plugin-boundaries, RC-019). Los componentes usan hooks y no llaman casos de uso directo.
  Calidad y TDD: cobertura >= 90% en domain/application (RC-002) y >= 80% global (RC-001), bundle inicial
  <= 300 KB gzip (RC-032), zonas táctiles >= 44x44 pt (RC-042) y cero violaciones axe (RC-040).
  Textos visibles en español de Colombia centralizados en shared/i18n/es-CO.ts (RNF-F-053); código en inglés.
  Commits obligatorios con Conventional Commits (RC-074). Requisitos de origen: RF-F, RNF-F y RC-xxx.
  Write all artifacts in Spanish.

rules:
  proposal:
    - Cita los IDs de requisito que cubre el cambio (RF-F, RNF-F y RC)
    - Indica el change del Backend cuyo contrato OpenAPI consume
    - Máximo 400 palabras
  specs:
    - Incluye la sección Purpose (mínimo 50 caracteres) cuando sea una capacidad nueva
    - Mantén la descripción de cada Requirement por debajo de 500 caracteres
    - Cada requisito lleva al menos un escenario con formato GIVEN/WHEN/THEN bajo un encabezado de 4 numerales
    - Incluye comportamiento táctil en iPad, estados sin conexión, casos de error y permisos por rol
  design:
    - Usa las secciones Context, Goals / Non-Goals, Decisions y Risks / Trade-offs
    - Indica la feature, las capas afectadas, los puertos y el almacenamiento local en Dexie
    - Describe los componentes UI, las zonas táctiles de 44x44 pt y el impacto en el límite de 300 KB gzip
  tasks:
    - Agrupa las tareas bajo encabezados numerados de nivel 2 (## 1. Nombre del grupo) de adentro hacia afuera
    - Cada bloque funcional empieza con su prueba en rojo, luego el código en verde y luego el refactor
    - Incluye verificación de accesibilidad con axe en los componentes de interfaz
    - Cada grupo de tareas termina con lint, tsc, pruebas en verde y un commit con Conventional Commits

operations:
  apply:
    guidance:
      - Ejecuta lint, tsc, pruebas con Vitest/axe y build antes de marcar un grupo como completo
      - Verifica que no se rompa eslint-plugin-boundaries ni los umbrales de cobertura
      - Realiza un git commit usando formato Conventional Commits al cerrar cada grupo de tareas de tasks.md
  archive:
    guidance:
      - Confirma que el cliente OpenAPI está sincronizado, el build no supera 300 KB gzip y git status está limpio
      - Resume lo entregado, los commits realizados y los IDs de requisito cubiertos