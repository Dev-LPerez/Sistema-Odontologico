schema: spec-driven

context: |
  Backend de un sistema de gestión odontológica (consultorio de la Dra. Angelee Pacheco, 1 a 3 usuarios).
  Este directorio es Backend dentro de un monorepo pnpm. El frontend está en Frontend con su propio OpenSpec.
  Stack: TypeScript estricto, NestJS como monolito modular, PostgreSQL con Prisma, pg-boss para tareas
  en segundo plano, Cloudflare R2 por API S3 detrás de un puerto StoragePort, Pino, Sentry, Jest y Supertest.
  Módulos: shared, health, identity (incluye Clinic y usuarios/roles ADMIN y AUXILIARY), patients, catalogs
  (procedimientos, precios y materiales propios con stock), clinical (historia, odontograma JSONB, atenciones
  y PDF), scheduling (agenda y Google Calendar), files (fotos, radiografías y consentimientos firmados),
  billing (cotizaciones y cobros), reporting (solo lectura), audit y messaging (Fase 2).
  Arquitectura: Clean Architecture completa en TODOS los módulos (domain, application, infrastructure,
  presentation). Las dependencias solo apuntan hacia adentro (dependency-cruiser). Domain y application no
  importan Nest ni Prisma ni usan new Date() o randomUUID() (usan ClockPort e IdGeneratorPort).
  Todas las tablas llevan clinicId desde el inicio (RNF-B-032). Un caso de uso por clase con un único método
  execute. Los controladores no tienen lógica de negocio. Un módulo solo importa el index.ts público de otro.
  Principios SOLID, TDD (cobertura >= 90% en domain/application y >= 80% global) y código en inglés con
  términos en Backend/docs/glosario.md.
  Restricciones críticas:
  1. Datos clínicos y PII de pacientes nunca en logs, Sentry ni URLs (RC-023).
  2. Fechas en UTC evaluadas en America/Bogota (RC-054).
  3. La base admite máximo 20 conexiones (pool de Prisma 5 y de pg-boss 3).
  4. Pacientes, catálogos e historias clínicas NUNCA se eliminan físicamente (RF-B-010, RC-055): todas sus
     relaciones Foreign Key en Prisma DEBEN usar onDelete: Restrict (prohibido onDelete: Cascade).
  5. Las suites de contrato (*.contract.spec.ts, RC-018) DEBEN ejecutarse contra PostgreSQL real (con
     migraciones aplicadas mediante prisma migrate deploy, RC-050) y contra InMemory; está PROHIBIDO simular
     PrismaService con mocks en memoria dentro de las pruebas de contrato.
  6. Todo repositorio Prisma e InMemory DEBE capturar violaciones de unicidad (P2002 en Prisma) al guardar y
     traducirlas al DomainError de categoría CONFLICT (409) correspondiente para evitar errores 500 en
     condiciones de carrera.
  7. El arranque HTTP se centraliza en configureApp(app) y se reutiliza en main.ts y en todos los tests E2E.
  Commits obligatorios con Conventional Commits (RC-074). Write all artifacts in Spanish.

rules:
  proposal:
    - Cita los IDs de requisito que cubre el cambio (RF-B, RNF-B y RC)
    - Indica el nombre del change equivalente en Frontend
    - Máximo 400 palabras
  specs:
    - Incluye la sección Purpose (mínimo 50 caracteres) cuando sea una capacidad nueva
    - Mantén la descripción de cada Requirement por debajo de 500 caracteres
    - Cada requisito lleva al menos un escenario con formato GIVEN/WHEN/THEN bajo un encabezado de 4 numerales
    - Describe comportamiento observable de la API (entradas, salidas, errores y permisos por rol), no la implementación
  design:
    - Usa las secciones Context, Goals / Non-Goals, Decisions y Risks / Trade-offs
    - Indica el módulo, las capas afectadas, los puertos nuevos o modificados y los eventos de dominio
    - Describe los cambios en el esquema de Prisma (usando onDelete:Restrict), en el contrato OpenAPI y si requiere un ADR
  tasks:
    - Agrupa las tareas bajo encabezados numerados de nivel 2 (## 1. Nombre del grupo) de adentro hacia afuera
    - Mapea explícitamente cada Scenario de spec.md al archivo .spec.ts/.e2e-spec.ts y nombre exacto del test it(...)
    - Exige que las pruebas de contrato (*.contract.spec.ts) corran contra PostgreSQL real (sin mocks de Prisma) y verifiquen traducción de P2002 a error de dominio 409
    - Cada grupo de tareas termina con lint, typecheck, deps:check y pruebas en verde más un commit con Conventional Commits
    - Incluye una tarea final para regenerar openapi.json y guardar en evidence.md la salida literal e íntegra de consola de lint, typecheck, deps:check, test:cov (tabla ASCII completa) y test:e2e

operations:
  apply:
    guidance:
      - Ejecuta lint, typecheck, deps:check y las pruebas (incluyendo suites de contrato contra PostgreSQL real) antes de marcar una tarea como completa
      - Usa exactamente los nombres de prueba it(...) mapeados en tasks.md para cada Scenario de la spec
      - Pega en evidence.md la salida literal y exacta de stdout/stderr de pnpm (incluyendo las líneas "> backend@0.0.1 <script>" y la tabla ASCII completa de Jest en test:cov); NUNCA la resumas ni escribas frases como "Salida con código 0"
      - Realiza un git commit usando formato Conventional Commits al cerrar cada grupo de tareas de tasks.md
  archive:
    guidance:
      - Confirma que evidence.md contiene la matriz Scenario -> Test y la salida literal de los 5 comandos sin resúmenes
      - Confirma que el documento OpenAPI está regenerado y que git status no tiene cambios pendientes