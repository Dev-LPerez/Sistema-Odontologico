version: 2
updates:
  # Monorepo pnpm (gestiona raíz, Backend y Frontend manteniendo sincronizado pnpm-lock.yaml)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dockerfile de Backend
  - package-ecosystem: 'docker'
    directory: '/Backend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2

  # Flujos de GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
